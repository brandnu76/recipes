name: assemble-tsb
on:
  workflow_dispatch:
  push:
    paths:
      - "images/_packs/tsb/**"
      - ".github/workflows/assemble-tsb.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and decode hero
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          pack = Path('images/_packs/tsb')
          if not pack.exists():
              print('no pack dir')
              raise SystemExit(0)
          parts = sorted(pack.glob('part*.txt'))
          if not parts:
              print('no parts')
              raise SystemExit(0)
          raw = ''.join(''.join(p.read_text().split()) for p in parts)
          data = base64.b64decode(raw)
          out = Path('images/texas-smoked-brisket.webp')
          if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('decoded bytes are not a WebP; leaving the existing hero in place')
          expected = int.from_bytes(data[4:8], 'little') + 8
          if expected != len(data):
              raise SystemExit(
                  f'incomplete WebP ({len(data)} bytes, header expects {expected}); leaving the existing hero in place'
              )
          out.parent.mkdir(exist_ok=True)
          out.write_bytes(data)
          print('wrote', out, len(data), 'from', len(parts), 'parts')
          PY
      - name: Commit decoded image
        run: |
          set -euo pipefail
          git config user.name "brandnu76"
          git config user.email "bccarroll30@gmail.com"
          git add images/texas-smoked-brisket.webp
          if git diff --cached --quiet; then
            echo "No image change"
            exit 0
          fi
          git commit -m "Add Texas smoked brisket hero image"
          git push
