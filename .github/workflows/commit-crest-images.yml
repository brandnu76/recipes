name: commit-crest-images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['images/_packs/logo-crest-*.b64']
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode crest packs
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          pack_dir = Path('images/_packs')
          for p in sorted(pack_dir.glob('logo-crest-*.b64')):
              name = p.name[:-4]
              raw = ''.join(p.read_text().split())
              pad = (-len(raw)) % 4
              if pad:
                  raw += '=' * pad
              data = base64.b64decode(raw)
              is_webp = len(data) >= 12 and data[:4] == b'RIFF' and data[8:12] == b'WEBP'
              is_png = data.startswith(bytes([137, 80, 78, 71, 13, 10, 26, 10]))
              if is_webp:
                  expected = int.from_bytes(data[4:8], 'little') + 8
                  if expected != len(data):
                      raise SystemExit(f'truncated {p.name}')
              elif not is_png:
                  print('skip', p.name)
                  continue
              out = Path('images') / name
              out.write_bytes(data)
              print('decoded', out, len(data))
          PY
      - name: Commit crest images
        run: |
          set -euo pipefail
          git config user.name "brandnu76"
          git config user.email "bccarroll30@gmail.com"
          shopt -s nullglob
          files=(images/logo-crest-*.webp images/logo-crest-*.png)
          if [ ${#files[@]} -eq 0 ]; then echo "no crest files"; exit 1; fi
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Decode crest image packs"
          git push
