name: Decode birria image

on:
  push:
    branches: [add/birria-tacos]
    paths:
      - "images/birria-tacos.webp.b64"

jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add/birria-tacos
      - name: Decode hero image and remove helper files
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          import base64
          src = Path("images/birria-tacos.webp.b64")
          dest = Path("images/birria-tacos.webp")
          data = base64.b64decode("".join(src.read_text().split()))
          if data[:4] != b"RIFF" or data[8:12] != b"WEBP":
              raise SystemExit("decoded file is not a valid WebP")
          dest.write_bytes(data)
          src.unlink()
          print("wrote", dest, len(data))
          PY
          rm -f .github/workflows/decode-birria-image.yml
          git config user.name "brandnu76"
          git config user.email "bccarroll30@gmail.com"
          git add images/birria-tacos.webp
          git add -A images/birria-tacos.webp.b64 .github/workflows/decode-birria-image.yml
          git status
          git commit -m "Add the Beef Birria Tacos hero image"
          git push origin add/birria-tacos
