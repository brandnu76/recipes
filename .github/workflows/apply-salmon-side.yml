name: apply-salmon-side
# Temporary. Unpacks the publish bundle, commits the recipe, and removes itself.
on:
  push:
    paths:
      - 'tmp-salmon-side-publish-bundle.json'
      - '.github/workflows/apply-salmon-side.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bundle, commit, and clean up
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          bundle = json.loads(Path('tmp-salmon-side-publish-bundle.json').read_text())
          for path, content in bundle.items():
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content)
              print('wrote', path, len(content))
          PY
          git config user.name "brandnu76"
          git config user.email "bccarroll30@gmail.com"
          git add sheet-pan-roasted-salmon-side.html seared-salmon-lemon-garlic-butter.html sw.js README.md \
            category-weekday-dinners.html recipes.html search-index.json \
            recipe-meta.json related.json ingredients.json
          git rm -f tmp-salmon-side-publish-bundle.json .github/workflows/apply-salmon-side.yml
          git commit -m "Publish Sheet-Pan Roasted Salmon Side with Lemon-Garlic Butter; cache v79"
          git push
