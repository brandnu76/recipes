name: cleanup-brand-scratch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-off logo/brand scratch files
        run: |
          set -euo pipefail
          git rm -q --ignore-unmatch logo_webp.* logo.webp.b64.part* logo-header.webp.b64 _encoding_probe.bin .pages-rebuild _fix_text_brand.py
          git -c user.name=brandnu76 -c user.email=bccarroll30@gmail.com commit -m "Remove one-off logo/brand scratch files"
          git push
