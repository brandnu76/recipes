name: decode-recipe-images
on:
  workflow_dispatch:
  push:
    paths:
      - "images/_packs/**"
      - "tools/inject_recipe_images.py"
      - ".github/workflows/decode-recipe-images.yml"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace gingersnap cheesecake hero
        run: |
          set -euo pipefail
          mkdir -p images
          curl -fsSL "https://litter.catbox.moe/uogw6a.webp" -o images/white-chocolate-gingersnap-cheesecake.webp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('images/white-chocolate-gingersnap-cheesecake.webp')
          b = p.read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', b[:16]
          print(p.name, len(b))
          html = Path('white-chocolate-gingersnap-cheesecake.html')
          t = html.read_text()
          t = t.replace(
              'alt="White chocolate gingersnap cheesecake"',
              'alt="No-bake white chocolate gingersnap cheesecake with cranberry-orange compote"',
          )
          html.write_text(t)
          PY
      - name: Commit replacement hero
        run: |
          set -euo pipefail
          git config user.name "brandnu76"
          git config user.email "bccarroll30@gmail.com"
          git add images/white-chocolate-gingersnap-cheesecake.webp white-chocolate-gingersnap-cheesecake.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Replace gingersnap cheesecake hero with cranberry-orange topping"
          git push
