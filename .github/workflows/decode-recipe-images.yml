name: decode-recipe-images
on:
  workflow_dispatch:
  push:
    paths:
      - "images/_packs/**"
      - "tools/inject_recipe_images.py"
      - ".github/workflows/decode-recipe-images.yml"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 image packs
        run: |
          set -euo pipefail
          mkdir -p images
          python3 - <<'PY'
          from pathlib import Path
          import base64
          pack_dir = Path('images/_packs')
          if not pack_dir.exists():
              print('no packs')
              raise SystemExit(0)
          for p in sorted(pack_dir.glob('*.b64')):
              name = p.name[:-4]
              raw = p.read_text().strip()
              if not raw or raw.startswith('PLACEHOLDER'):
                  print('skip', p.name)
                  continue
              out = Path('images') / name
              data = base64.b64decode(raw)
              out.write_bytes(data)
              print('decoded', out, len(data))
          PY
      - name: Commit decoded images
        run: |
          set -euo pipefail
          git config user.name "brandnu76"
          git config user.email "bccarroll30@gmail.com"
          git add images/*.webp || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Decode recipe image packs"
          git push
