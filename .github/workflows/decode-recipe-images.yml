name: decode-recipe-images
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-recipe-images.yml"
      - "tools/inject_recipe_images.py"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract recipe hero images
        run: |
          set -euo pipefail
          mkdir -p images
          curl -fsSL -o /tmp/recipe-heroes.tar.gz https://litter.catbox.moe/ozvtrz.gz
          python3 - <<'PY'
          import gzip, tarfile
          from pathlib import Path
          src = Path('/tmp/recipe-heroes.tar.gz')
          assert src.stat().st_size > 1_000_000, src.stat().st_size
          out = Path('images')
          with gzip.open(src, 'rb') as gz, tarfile.open(fileobj=gz, mode='r:') as tar:
              tar.extractall(out)
          files = sorted(out.glob('*.webp'))
          assert len(files) >= 27, len(files)
          for p in files:
              b = p.read_bytes()
              assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', p.name
              print(p.name, len(b))
          print('count', len(files))
          PY
      - name: Inject hero and card markup
        run: python3 tools/inject_recipe_images.py
      - name: Commit images and page updates
        run: |
          set -euo pipefail
          git config user.name "brandnu76"
          git config user.email "bccarroll30@gmail.com"
          git add images/*.webp *.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add recipe hero images and wire them into pages"
          git push
