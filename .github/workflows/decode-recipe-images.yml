name: decode-recipe-images
on:
  workflow_dispatch:
  push:
    paths:
      - "images/_packs/**"
      - "tools/inject_recipe_images.py"
      - ".github/workflows/decode-recipe-images.yml"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish cache-busted gingersnap hero
        run: |
          set -euo pipefail
          src=images/white-chocolate-gingersnap-cheesecake.webp
          dest=images/white-chocolate-gingersnap-cheesecake-v2.webp
          test -f "$src"
          cp "$src" "$dest"
          python3 - <<'PY'
          from pathlib import Path
          old = "images/white-chocolate-gingersnap-cheesecake.webp"
          new = "images/white-chocolate-gingersnap-cheesecake-v2.webp"
          abs_old = "https://brandnu76.github.io/recipes/" + old
          abs_new = "https://brandnu76.github.io/recipes/" + new
          for p in Path('.').glob('*.html'):
              t = p.read_text()
              if old not in t and abs_old not in t:
                  continue
              t = t.replace(abs_old, abs_new).replace(old, new)
              p.write_text(t)
              print('patched', p.name)
          sw = Path('sw.js')
          t = sw.read_text()
          t = t.replace('carroll-lowcountry-v2', 'carroll-lowcountry-v3')
          sw.write_text(t)
          print('sw cache bumped')
          PY
      - name: Commit cache-bust
        run: |
          set -euo pipefail
          git config user.name "brandnu76"
          git config user.email "bccarroll30@gmail.com"
          git add images/white-chocolate-gingersnap-cheesecake-v2.webp *.html sw.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Cache-bust gingersnap cheesecake photo URL"
          git push
