name: decode-recipe-images
# Manual only. Auto-push of base64 packs previously wrote truncated images.
# Run only when complete packs are ready. The image check will still gate the result.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['images/_packs/**']
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 image packs
        run: |
          set -euo pipefail
          mkdir -p images
          python3 <<'PY'
          from pathlib import Path
          import base64
          pack_dir = Path('images/_packs')
          if not pack_dir.exists():
              print('no packs')
              raise SystemExit(0)
          PNG = bytes([137, 80, 78, 71, 13, 10, 26, 10])
          for p in sorted(pack_dir.glob('*.b64')):
              name = p.name[:-4]
              raw = ''.join(p.read_text().split())
              if not raw or raw.startswith('PLACEHOLDER'):
                  print('skip', p.name)
                  continue
              pad = (-len(raw)) % 4
              if pad:
                  raw += '=' * pad
                  print('padded', p.name, pad)
              data = base64.b64decode(raw)
              is_webp = len(data) >= 12 and data[:4] == b'RIFF' and data[8:12] == b'WEBP'
              is_png = data.startswith(PNG)
              if is_webp:
                  expected = int.from_bytes(data[4:8], 'little') + 8
                  if expected != len(data):
                      print(f'skip truncated {p.name}: {len(data)} vs {expected}')
                      continue
              elif not is_png:
                  print('skip unsupported', p.name)
                  continue
              out = Path('images') / name
              out.write_bytes(data)
              print('decoded', out, len(data))
          PY
      - name: Commit decoded images
        run: |
          set -euo pipefail
          git config user.name "brandnu76"
          git config user.email "bccarroll30@gmail.com"
          shopt -s nullglob
          files=(images/logo-crest-*.webp images/logo-crest-*.png)
          if [ ${#files[@]} -gt 0 ]; then git add -- "${files[@]}"; fi
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Decode recipe image packs"
          git push
