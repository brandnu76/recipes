name: decode-recipe-images
on:
  workflow_dispatch:
  push:
    paths:
      - "images/_packs/**"
      - "tools/inject_recipe_images.py"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode any new image packs to images/*.webp
        run: |
          set -euo pipefail
          mkdir -p images
          shopt -s nullglob
          packs=(images/_packs/*.webp.b64)
          if [ ${#packs[@]} -eq 0 ]; then
            echo "No new packs"
            ls images/*.webp | wc -l
            exit 0
          fi
          for f in "${packs[@]}"; do
            name=$(basename "$f" .b64)
            echo "decoding $name"
            base64 -d "$f" > "images/$name"
          done
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path('images').glob('*.webp'))
          assert files, 'no webp decoded'
          for p in files:
              b = p.read_bytes()
              assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', p
              print(p.name, len(b))
          print('count', len(files))
          PY
      - name: Inject hero and card markup
        run: python3 tools/inject_recipe_images.py
      - name: Commit images and page updates
        run: |
          set -euo pipefail
          git config user.name "brandnu76"
          git config user.email "bccarroll30@gmail.com"
          git add images/*.webp *.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add recipe hero images and wire them into pages"
          git push
