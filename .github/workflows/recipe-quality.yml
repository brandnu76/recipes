name: Recipe quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Catalog, indexes, JSON-LD, images and links
        run: python3 tools/check_recipe_catalog.py
      - name: Plan a Meal regression tests
        run: node --test tests/
