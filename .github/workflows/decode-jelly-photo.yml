name: decode-jelly-photo
on:
  push:
    paths: ['.github/workflows/decode-jelly-photo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d images/homemade-grape-jelly.webp.b64 > images/homemade-grape-jelly.webp
          git rm -q images/homemade-grape-jelly.webp.b64 .github/workflows/decode-jelly-photo.yml
          git add images/homemade-grape-jelly.webp
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m 'Add grape jelly photo (webp); remove staging files'
          git push
